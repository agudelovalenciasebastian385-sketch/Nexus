# Memory profile (mvnw spring-boot:run -Dspring-boot.run.profiles=memory): runs without MySQL or MongoDB.
# The memory adapters replace the JPA and MongoDB ones, and the data is lost when the application stops.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

app:
  seed:
    # Sample seller, operator, supervisor and buyer created by MemoryDemoDataSeeder.
    demo:
      enabled: ${SEED_DEMO_ENABLED:true}
