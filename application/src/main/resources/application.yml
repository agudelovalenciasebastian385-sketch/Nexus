spring:
  application:
    name: nexusmarket
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NexusMarketPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:nexusmarket}

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:NexusMarket-Development-Secret-Key-Please-Change-In-Production-2026}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
