services:
  mysql-db:
    image: mysql:8.0
    container_name: nexusmarket-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexusmarket
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-db:
    image: mongo:6.0
    container_name: nexusmarket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Interfaz visual para MySQL: http://localhost:8081 (usuario root / root)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: nexusmarket-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql-db:
        condition: service_healthy

  # Interfaz visual para MongoDB: http://localhost:8082 (usuario admin / admin)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: nexusmarket-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo-db:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
    depends_on:
      - mongo-db

volumes:
  mysql_data:
  mongo_data:
